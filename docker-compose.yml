# 責務: 単一ノード構成のサービス、ネットワーク、永続 volume と固定 project 名を定義する。
name: vpngwgui

services:
  web:
    restart: always
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - app-net
    environment:
      API_ORIGIN: http://api:3000
      WEB_HTTPS_ENABLED: ${WEB_HTTPS_ENABLED:-false}

  api:
    restart: always
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - app-net
    user: "10001:10001"
    volumes:
      - ./vendors:/etc/vpngwgui/vendors:ro
      - api-data:/var/lib/vpngwgui
      - gateway-socket:/run/vpngw-gateway
    environment:
      VENDORS_DIR: /etc/vpngwgui/vendors
      ENABLED_PROVIDERS: ${VPN_PROVIDERS:-}
      GATEWAY_SOCKET_PATH: /run/vpngw-gateway/gateway.sock
      GATEWAY_TLS_ENABLED: ${GATEWAY_TLS_ENABLED:-false}
      WEB_HTTPS_ENABLED: ${WEB_HTTPS_ENABLED:-false}
      PROVIDER_CACHE_DIR: /var/lib/vpngwgui-provider-cache
      STATE_DIR: /var/lib/vpngwgui
      SETTINGS_FILE: /var/lib/vpngwgui/settings.json
      AUDIT_LOG_FILE: /var/lib/vpngwgui/audit.log

  proxy:
    restart: always
    build:
      context: .
      dockerfile: proxy/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    init: true
    volumes:
      - ctl-socket:/var/run/vpngw-ctl
      - gateway-socket:/run/vpngw-gateway
    environment:
      CTL_SOCKET_DIR: /var/run/vpngw-ctl
      GATEWAY_SOCKET_PATH: /run/vpngw-gateway/gateway.sock
      GATEWAY_TLS_ENABLED: ${GATEWAY_TLS_ENABLED:-false}
      DNS_RELAY_PORT: ${DNS_RELAY_PORT:-53}
      LAN_IFACE: ${LAN_IFACE:-}

networks:
  app-net: {}

volumes:
  api-data: {}
  gateway-socket: {}
  ctl-socket: {}
