services:
  web:
    restart: always
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-net
    depends_on:
      - api
    environment:
      API_ORIGIN: http://api:3000

  api:
    restart: always
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - app-net
    user: "10001:10001"
    depends_on:
      - proxy
    volumes:
      - ctl-socket:/var/run/vpngw-ctl
      # プロバイダは.envのVPN_PROVIDER（既定adguardvpn）で選ぶ（specs/design.md「プロバイダの選択と実行基盤」）。
      - ./api/config/profiles/${VPN_PROVIDER:-adguardvpn}.json:/etc/vpngwgui/vpn-profile.json:ro
      - api-data:/var/lib/vpngwgui
    environment:
      VPN_PROFILE_PATH: /etc/vpngwgui/vpn-profile.json
      PROXY_SOCKET_PATH: /var/run/vpngw-ctl/exec.sock
      SETTINGS_FILE: /var/lib/vpngwgui/settings.json
      AUDIT_LOG_FILE: /var/lib/vpngwgui/audit.log
      CONNECTION_STATE_FILE: /var/lib/vpngwgui/connection-state.json

  proxy:
    restart: always
    build:
      context: .
      dockerfile: proxy/Dockerfile.${VPN_PROVIDER:-adguardvpn}
    # 本来はPhase3（wbs/phase3.md）で行う予定だった変更だが、実機検証でDockerブリッジネットワークが
    # IPv6を透過しないためコンテナ再作成のたびに実CLIのログインセッションが失効する不具合が発覚し、
    # host networkへの切替が唯一の解決策と確認できたため、この部分のみPhase2で前倒しする
    # （wbs/phase2.md「次フェーズへの申し送り」参照）。透過ゲートウェイ・nftables・インストール
    # スクリプト等、host化に付随する他のタスクはPhase3のまま。
    network_mode: host
    user: "10001:10001"
    # 実VPNベンダーCLIがトンネルを確立するために必要（Phase 2）。
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # 実CLIが内部でバックグラウンドプロセスをforkする（`connect`実行時等）ため、
    # 孤児プロセスがゾンビ化しないようinitプロセス（tini相当）を挟む。
    init: true
    volumes:
      - ctl-socket:/var/run/vpngw-ctl
      # 実CLIのログイン情報（および永続化したmachine-id、proxy/docker-entrypoint.sh参照）の永続化。
      # 無ければコンテナ再作成のたびに再ログインが必要になる（上記network_mode: hostとあわせて必須。
      # wbs/phase2.md「次フェーズへの申し送り」参照）。
      - adguard-data:/home/vpngwgui/.local/share/adguardvpn-cli
    environment:
      CTL_SOCKET_PATH: /var/run/vpngw-ctl/exec.sock
      # install/detect-lan-interface.shがリポジトリルートの.envへ書き出すLAN側インターフェース名
      # （docker composeが.envを自動読み込みし、ここで変数展開する）。未設定（未インストール環境）の
      # 場合は空文字列となり、proxy側は透過ゲートウェイを構成しない（proxy/src/server.ts参照）。
      LAN_IFACE: ${LAN_IFACE:-}
      # フェイルオープン時の送出インターフェース名。単一NIC構成が対象ターゲットのため通常は未設定のまま
      # LAN_IFACEを流用する（proxyserver/design.md「Kill Switch」参照）。

networks:
  app-net: {}

volumes:
  ctl-socket: {}
  api-data: {}
  adguard-data: {}
