# 責務: E2E（hosted）専用の compose の上書き。ランナーのビルドを、モック CLI のイメージ（e2e/hosted/vendors/<ID>/Dockerfile）へ差し替える（e2e-tests 1.11）。
# 本番では使わない。導入の後に、.env の COMPOSE_FILE の末尾へ追記して使う（e2e/hosted/lib/provision.sh）。
# composeの合成では build の dockerfile の値が、この上書きで置き換わる（context・ユーザー・ネットワークは本番と同じ）。
services:
  runner-protonvpn:
    build:
      context: .
      dockerfile: e2e/hosted/vendors/protonvpn/Dockerfile
  runner-adguardvpn:
    build:
      context: .
      dockerfile: e2e/hosted/vendors/adguardvpn/Dockerfile
