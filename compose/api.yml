# 責務: apiロール（VPNベンダー操作・設定管理・利用者認証）のcompose fragment。
# specs/design.md「デプロイメント構成の分離とロール別インストール」参照。パスの解決についてはcompose/web.yml冒頭の注記を参照。
services:
  api:
    restart: always
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - app-net
    user: "10001:10001"
    ports:
      # 単一ホスト構成ではweb→apiはDockerネットワーク内の名前解決（api:3000）で届くため本来不要だが、
      # 分離構成（webが別ホスト）ではホストのアドレス経由で到達する必要があるため、常に公開する
      # （APIサーバ自身のTLS＋web側でのCA検証が実質的な境界。proxyのGATEWAY_PORTと同じ考え方）。
      - "${API_PORT:-3000}:3000"

    # proxy（ゲートウェイ）・ランナーは分離構成では別ホストのため、depends_on（同一Compose project内限定）は
    # 指定しない（起動していないランナーは、APIが「利用不可」として扱う。specs/apiserver/design.md「ランナーの利用可否」）。
    # 単一ホスト構成では、network_mode: hostのproxyが公開するGATEWAY_PORTへ、ホストのゲートウェイIP経由で
    # 到達する（apiはブリッジネットワーク上のため、コンテナから見た「ホスト自身」を名前解決する必要がある）。
    # 分離構成ではGATEWAY_HOSTを相手ホストのアドレスへ上書きするため、この行は無害。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # ベンダーバンドル（vendors/<ベンダーID>/profile.json）。有効にするのは下のENABLED_PROVIDERS。
      - ./vendors:/etc/vpngwgui/vendors:ro
      - api-data:/var/lib/vpngwgui
      # ゲートウェイ制御チャネル（mTLS TCP）のクライアント証明書一式、APIサーバ自身のHTTPSサーバ証明書
      # （api-server.crt/.key）。install.shがホストの/etc/vpngwgui/pki/へローカル生成（単一ホスト構成）
      # またはscp配布（分離構成）する。
      - /etc/vpngwgui/pki:/etc/vpngwgui/pki:ro
    environment:
      VENDORS_DIR: /etc/vpngwgui/vendors
      # 有効なベンダー（カンマ区切り）。既定は無い。install/install.shが.envのVPN_PROVIDERSとCOMPOSE_FILE（有効なベンダーの
      # compose fragment）を書く。
      ENABLED_PROVIDERS: ${VPN_PROVIDERS:?VPN_PROVIDERSが未設定です。install/install.sh --providers <ベンダーID>,... で有効にするベンダーを指定してください}
      # ゲートウェイ制御チャネル（mTLS TCP）の接続先。単一ホスト構成の既定はhost.docker.internal:8443
      # （上のextra_hosts参照）。分離構成ではinstall.shが.envのGATEWAY_HOST・GATEWAY_PORTを書く。
      GATEWAY_HOST: ${GATEWAY_HOST:-host.docker.internal}
      GATEWAY_PORT: ${GATEWAY_PORT:-8443}
      # ベンダーCLIのキャッシュ（読み取り専用）の置き場（<置き場>/<ベンダーID>/）。プランで接続できる接続先の参考一覧を読むため。
      # 各ベンダーのキャッシュのボリュームは、そのバンドルのcompose.yml（services.apiのvolumes）が、この置き場の下へ読み取り専用でマウントする
      # （ベンダーバンドルはgatewayロールと合成するため、apiがgatewayと別ホストの分離構成では、このマウントは反映されない。
      # 「プランで接続できる接続先の参考一覧」表示のみに影響し、接続そのものは行える）。
      PROVIDER_CACHE_DIR: /var/lib/vpngwgui-provider-cache
      STATE_DIR: /var/lib/vpngwgui
      SETTINGS_FILE: /var/lib/vpngwgui/settings.json
      AUDIT_LOG_FILE: /var/lib/vpngwgui/audit.log

networks:
  app-net: {}

volumes:
  api-data: {}
