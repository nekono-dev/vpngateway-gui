# 責務: タグから Compose bundle を作り、検査済み tarball と checksum を GitHub Release に添付する。
name: release-compose-bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/installer-check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compose bundle と checksum を作成
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          sh scripts/build-compose-bundle.sh "$VERSION" "dist/vpngwgui-$VERSION.tar.gz"
          (cd dist && sha256sum "vpngwgui-$VERSION.tar.gz" > "vpngwgui-$VERSION.tar.gz.sha256")
          cat "dist/vpngwgui-$VERSION.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: vpngwgui-${{ github.ref_name }}
          path: dist/vpngwgui-${{ github.ref_name }}.tar.gz*
          if-no-files-found: error

  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: GitHub Release へ bundle と checksum を添付
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/vpngwgui-"$TAG".tar.gz dist/vpngwgui-"$TAG".tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
