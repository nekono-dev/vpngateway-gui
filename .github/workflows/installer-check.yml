# 責務: dev work branch とリリース前に Compose bundle の内容・実行構成を検査する。
name: compose-bundle-check

on:
  workflow_call:
  pull_request:
    branches: ["dev/**"]
  push:
    branches: ["dev/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell 構文と shellcheck
        run: |
          sh -n scripts/build-compose-bundle.sh
          sh -n scripts/test-compose-bundle.sh
          shellcheck -S warning scripts/build-compose-bundle.sh scripts/test-compose-bundle.sh

      - name: Compose bundle manifest・内容・展開後 config を検査
        run: sh scripts/test-compose-bundle.sh
