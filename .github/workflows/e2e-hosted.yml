# hosted runner の E2E（e2e-tests）。npm run test:e2e（sh e2e/hosted/run.sh）を、GitHub-hosted runner で実行する。
# hosted E2E は実行時間が長いため、GitHub Actions から手動実行する。
name: e2e-hosted

on:
  workflow_dispatch:
    inputs:
      intentional_failure:
        description: "3.2 の確認: 意図的な失敗を起こし、失敗時の診断の成果物を確かめる"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 依存と Playwright の導入
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          npm ci --no-audit --no-fund >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Compose fixture の既定構成を検証
        run: |
          docker compose -p vpngwgui -f docker-compose.yml -f vendors/protonvpn/compose.yml -f vendors/adguardvpn/compose.yml -f docker-compose.e2e-mock.yml -f e2e/hosted/vendors/protonvpn/compose.yml -f e2e/hosted/vendors/adguardvpn/compose.yml config --quiet

      - name: E2E unit と Compose 契約
        run: |
          set -eux
          # api-types の契約テストが読む OpenAPI 定義（git の対象外の生成物）を先に作る
          npm run export-openapi
          # 実 Docker の volume 保持テストが使うイメージ（ない場合はテストが skip されるため先に取得する）
          docker pull alpine:3.21
          npm run test:e2e-unit
          sh e2e/hosted/tests/cleanup.test.sh
          sh e2e/hosted/tests/provision-order.test.sh

      - name: E2E（hosted）
        env:
          E2E_INTENTIONAL_FAILURE: ${{ inputs.intentional_failure && '1' || '' }}
        run: npm run test:e2e

      - name: 成果物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-hosted-artifacts
          path: e2e/artifacts/hosted
          if-no-files-found: ignore
