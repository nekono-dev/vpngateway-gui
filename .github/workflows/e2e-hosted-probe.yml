# 一時的な確認（e2e-tests 1.1・1.6）: GitHub-hosted runner で、systemd の状態と、単一ブリッジの構成（topology）を確かめる。
# 確認が済んだら削除する。
name: e2e-hosted-probe

on:
  push:
    branches: [feat/e2e-tests]
    paths: [".github/workflows/e2e-hosted-probe.yml", "e2e/hosted/lib/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: systemd の状態（degraded の原因）
        run: |
          systemctl is-system-running || true
          systemctl --failed --no-pager || true
          systemctl list-unit-files --no-pager | grep -i vpngwgui || echo "vpngwgui 系の単位は無い"

      - name: 単一ブリッジの構成（topology）の往復
        run: |
          set -eux
          sudo apt-get install -y -qq nftables iproute2 >/dev/null
          . e2e/hosted/lib/env.sh
          . e2e/hosted/lib/topology.sh
          route_of() { ip -4 route show default | head -n 1 | sed -n 's/.*via \([^ ]*\) dev \([^ ]*\).*/\1 \2/p'; }
          before="$(route_of)"
          echo "before: $before"
          topology_up
          sudo ip route get 1.1.1.1
          test "$(sudo ip route get 192.168.50.254 | sed -n 's/.* dev \([^ ]*\).*/\1/p')" = "e2eseg"
          lan_exec ping -c 2 -W 2 192.168.50.254
          topology_down
          after="$(route_of)"
          echo "after: $after"
          test "$before" = "$after"
          ip netns list | grep -E '^(lan|isp|vpnexit)' && exit 1 || true
          ip link show e2eseg 2>/dev/null && exit 1 || true
          echo "topology: 往復 OK"

      - name: VPN トンネルの接続・切断（モック CLI の経路操作）
        timeout-minutes: 4
        run: |
          set -eux
          sudo apt-get install -y -qq iproute2 >/dev/null
          echo '>>> npm ci'
          timeout 300 npm ci --no-audit --no-fund >/dev/null
          echo '>>> npm ci done'
          . e2e/hosted/lib/env.sh
          . e2e/hosted/lib/topology.sh
          route_of() { ip -4 route show default | head -n 1 | sed -n 's/.*via \([^ ]*\) dev \([^ ]*\).*/\1 \2/p'; }
          before="$(route_of)"
          topology_up
          echo '>>> connect'
          timeout 60 npx tsx -e 'import { createNetwork } from "./e2e/hosted/vendors/mock-cli/network.ts"; const n = createNetwork("e2e/hosted/.work/mock-route.txt"); n.connect(); n.connect();'
          echo '>>> check'
          ip route get 1.1.1.1
          test "$(sudo ip route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p')" = "vpn0"
          sudo ip -n vpnexit addr show vpn0x
          sudo ip netns exec vpnexit ping -c 1 -W 2 10.66.0.1
          echo '>>> runner keeps GitHub reachability while the tunnel is up'
          curl -sS -o /dev/null -m 15 https://api.github.com/ && echo 'GitHub 到達: OK'
          echo '>>> disconnect'
          timeout 60 npx tsx -e 'import { createNetwork } from "./e2e/hosted/vendors/mock-cli/network.ts"; createNetwork("e2e/hosted/.work/mock-route.txt").disconnect();'
          sudo ip route get 1.1.1.1 | grep -q e2eseg && echo "経路: e2eseg（ISP 経由）" || true
          topology_down
          test "$(route_of)" = "$before"
          echo "tunnel: OK"

      - name: 後始末（既定経路と構成を戻す）
        if: always()
        run: |
          . e2e/hosted/lib/env.sh
          . e2e/hosted/lib/topology.sh
          topology_down || true
          ip -4 route show default || true

  provision:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 導入（本番の経路）→ E2E 用の上書きで起動 → 既定経路の切り替え → 応答の確認
        run: |
          set -eux
          sudo apt-get install -y -qq iproute2 nftables curl >/dev/null
          . e2e/hosted/lib/env.sh
          . e2e/hosted/lib/topology.sh
          . e2e/hosted/lib/provision.sh
          topology_links
          provision_install "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)"
          provision_start
          topology_route_isp
          provision_wait
          sudo docker compose --project-directory /opt/vpngwgui ps
          curl -sk -o /dev/null -w 'web: %{http_code}\n' "https://127.0.0.1:$E2E_WEB_PORT/"
          sudo ls -l /etc/vpngwgui/pki/ || true
          curl -s --cacert "$(provision_export_ca)" -o /dev/null -w 'api: %{http_code}\n' "https://127.0.0.1:3000/v1/operator" || true

      - name: 後始末（既定経路と構成を戻す）
        if: always()
        run: |
          . e2e/hosted/lib/env.sh
          . e2e/hosted/lib/topology.sh
          topology_down || true
          [ -x e2e/hosted/.work/install.sh ] && sudo sh e2e/hosted/.work/install.sh uninstall --purge >/dev/null 2>&1 || true
          exit 0
