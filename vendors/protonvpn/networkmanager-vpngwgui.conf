# 責務: runner-protonvpnコンテナ内のNetworkManager（Proton VPN CLIのWireGuard接続用）の設定テンプレート。
# エントリポイント（entrypoint.sh）が__UPLINK_EXCEPT__を置換して/etc/NetworkManager/conf.d/に出力する。
# network_mode: hostのため、NMはホストの全インターフェースを見る。ホストのネットワーク（DHCP・静的設定・Docker・LXC）を
# 奪わないよう、次の3種以外を全て管理対象外にする。
#  - WireGuardデバイス: Proton VPNのトンネル。
#  - dummyデバイス: CLIが作るNM式Kill Switch（pvpn-killswitch。管理対象外だと有効化されず接続が失敗する）。
#  - 上り側NIC（LAN_IFACE）: CLIのWireGuard接続は、VPNサーバ宛の経路をNMが「有効化済みの物理NIC」へ足して
#    Kill Switch（default経路を握りつぶすdummy）を迂回する。物理NICが管理対象外だとその経路が作られず、
#    サーバへ到達できず「Connection failed」になる。NM起動時から管理対象にするとホストの既存設定をそのまま
#    引き継ぐ（connected (externally)）ため、IP・経路は変わらない。起動後に管理対象へ切り替えるとIPが外れるので不可。
#    （specs/runner/design.md「Proton VPNランナーとNetworkManager」）
[main]
plugins=keyfile
# 起動時に「Wired connection」等の接続を自動生成しない。
no-auto-default=*
# /etc/resolv.confを書き換えない（コンテナの/etc/resolv.confはホストのコピーだが、ホストのDNS設定を変えない）。
dns=none
rc-manager=unmanaged
# polkitを使わない（コンテナにpolkitdは無い）。D-Bus経由の操作はvpngwguiが行う。
auth-polkit=false

[keyfile]
unmanaged-devices=*,except:type:wireguard,except:type:dummy__UPLINK_EXCEPT__

[logging]
level=INFO
