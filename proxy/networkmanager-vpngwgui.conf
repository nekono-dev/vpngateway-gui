# 責務: proxyコンテナ内のNetworkManager（Proton VPN CLIのWireGuard接続用）の設定。
# network_mode: hostのため、NMはホストの全インターフェースを見る。ホストのネットワーク（DHCP・静的設定・Docker・LXC）を
# 奪わないよう、WireGuardデバイス以外を全て管理対象外にする（specs/proxyserver/design.md「NetworkManagerの制限」）。
[main]
plugins=keyfile
# 起動時に「Wired connection」等の接続を自動生成しない。
no-auto-default=*
# /etc/resolv.confを書き換えない（コンテナの/etc/resolv.confはホストのコピーだが、ホストのDNS設定を変えない）。
dns=none
rc-manager=unmanaged
# polkitを使わない（コンテナにpolkitdは無い）。D-Bus経由の操作はvpngwguiが行う。
auth-polkit=false

[keyfile]
unmanaged-devices=*,except:type:wireguard

[logging]
level=INFO
